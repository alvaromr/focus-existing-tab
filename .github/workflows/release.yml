name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Check tag matches manifest version
        run: test "v$(node -p "require('./manifest.json').version")" = "${GITHUB_REF_NAME}"
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome
      # Builds the zip and runs the e2e against it unpacked, as a user installs it.
      - run: pnpm smoke:package
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
          CHROME_ARGS: --no-sandbox
      - run: bash scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > release-notes.md
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*.zip
          body_path: release-notes.md
