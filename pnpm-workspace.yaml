# Supply-chain hardening (pnpm >= 11). Dependency install scripts and exotic transitive
# dependencies are already blocked by default; these tighten the rest.
minimumReleaseAge: 5760 # only install versions published >= 4 days ago (strict: fail instead of fallback)
trustPolicy: no-downgrade # never update to a version with weaker provenance than the installed one
verifyDepsBeforeRun: error # refuse to run scripts if node_modules does not match the lockfile
allowBuilds: {} # no dependency may run preinstall/postinstall; add packages here explicitly
overrides:
  # typed-rest-client 2.3.1 (via Stryker) pins qs 6.15.1, which has four DoS advisories fixed by
  # 6.16.2. Remove once typed-rest-client depends on a fixed qs.
  typed-rest-client>qs: 6.16.2
auditConfig:
  ignoreGhsas:
    # minimatch < 11.0.1 globparts DoS, reached only through @stryker-mutator/core, which pins
    # minimatch ~10.2.4 (dev-only, runs on local code, never in the shipped zip). Remove this entry
    # once Stryker ships with minimatch >= 11.0.1.
    - GHSA-g3hv-75wg-m249
